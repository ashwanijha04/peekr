[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peekr"
version = "0.2.0"
description = "Zero-config observability for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
bedrock = ["boto3>=1.28"]
serve = ["flask>=3.0"]
all = ["openai>=1.0", "anthropic>=0.20", "boto3>=1.28", "flask>=3.0"]
dev = ["pytest>=8.0", "flask>=3.0"]

[project.urls]
Homepage = "https://ashwanijha04.github.io/peekr"
Repository = "https://github.com/ashwanijha04/peekr"

[project.scripts]
peekr = "peekr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peekr*"]

[tool.setuptools.package-data]
peekr = ["serve/templates/*.html", "serve/static/*.css", "serve/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
