[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peekr"
version = "0.3.2"
description = "Zero-config observability for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
bedrock = ["boto3>=1.28"]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
crewai = ["crewai>=0.30.0"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "boto3>=1.28",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "crewai>=0.30.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
dev = ["pytest>=8.0", "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]

[project.urls]
Homepage = "https://ashwanijha04.github.io/peekr"
Repository = "https://github.com/ashwanijha04/peekr"

[project.scripts]
peekr = "peekr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peekr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
