[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peekr"
version = "0.9.2"
description = "In-process observability, evaluation & compliance guardrails for AI agents — no proxy, claim-level hallucination detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "llm", "llmops", "observability", "ai-agents", "agent-observability",
    "tracing", "hallucination-detection", "guardrails", "ai-compliance",
    "hipaa", "fdcpa", "finra", "gdpr", "evaluation", "llm-monitoring",
    "openai", "anthropic", "langchain", "opentelemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
bedrock = ["boto3>=1.28"]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
crewai = ["crewai>=0.30.0"]
gemini = ["google-genai>=0.3.0"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
litellm = ["litellm>=1.0"]
pinecone = ["pinecone-client>=3.0"]
chroma = ["chromadb>=0.4"]
qdrant = ["qdrant-client>=1.7"]
vectordb = ["pinecone-client>=3.0", "chromadb>=0.4", "qdrant-client>=1.7"]
mcp = ["mcp>=1.2.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "boto3>=1.28",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "crewai>=0.30.0",
    "google-genai>=0.3.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "litellm>=1.0",
    "pinecone-client>=3.0",
    "chromadb>=0.4",
    "qdrant-client>=1.7",
    "mcp>=1.2.0",
]
dev = ["pytest>=8.0", "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]

[project.urls]
Homepage = "https://peekr.starkspherelabs.com"
Documentation = "https://peekr.starkspherelabs.com/docs"
Repository = "https://github.com/ashwanijha04/peekr"
Changelog = "https://github.com/ashwanijha04/peekr/blob/main/README.md#changelog"

[project.scripts]
peekr = "peekr.cli:main"
peekr-mcp = "peekr.mcp_server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["peekr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
