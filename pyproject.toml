[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "peekai"
version = "0.1.0"
description = "Zero-config observability for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://ashwanijha04.github.io/peekai"
Repository = "https://github.com/ashwanijha04/peekai"

[project.scripts]
peekai = "peekai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peekai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
