<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}peekr{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<nav class="topnav">
  <a class="nav-logo" href="{{ url_for('index') }}">peek<span>r</span></a>
  <div class="nav-links">
    <a href="{{ url_for('index') }}">Traces</a>
    <a href="{{ url_for('compare') }}">Compare</a>
    <span class="nav-source" title="Storage source">{{ source }}</span>
  </div>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  Local-first · data stays on your machine · no signup · no telemetry
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
